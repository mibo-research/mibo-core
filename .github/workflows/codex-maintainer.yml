name: Codex observer maintainer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex:
    runs-on: ubuntu-latest
    environment: codex-maintenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run tests first
        run: python -m unittest discover -s automation/tests -v
      - name: Codex readiness review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/maintain-observer.md
          output-file: codex-readiness.md
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
      - name: Upload Codex review
        uses: actions/upload-artifact@v4
        with:
          name: codex-readiness
          path: codex-readiness.md
          retention-days: 14
